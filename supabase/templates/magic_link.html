<!--
  Sign-in email for Jarvis. It shows the one-time code ({{ .Token }}) and no
  link, because a link would open in the phone's browser instead of the
  installed app.
-->
<div style="margin:0;padding:32px 16px;background:#0b0b0c;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:420px;margin:0 auto;padding:32px 28px;background:#151517;border:1px solid #26262a;border-radius:16px;color:#f2f1ee;">
    <p style="margin:0 0 8px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f5a524;">Jarvis</p>
    <h1 style="margin:0 0 20px;font-size:20px;font-weight:600;color:#f2f1ee;">Your sign-in code</h1>
    <p style="margin:0 0 24px;padding:16px 0;background:#0b0b0c;border-radius:12px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;color:#f2f1ee;">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:15px;line-height:22px;color:#c9c7c1;">Type this code into Jarvis to sign in. It works once and expires in 10 minutes.</p>
    <p style="margin:0;font-size:13px;line-height:20px;color:#8b8a85;">If you did not ask for it, you can ignore this email. Nobody can sign in without the code.</p>
  </div>
</div>
